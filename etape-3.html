<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compose ton pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>

.band{padding:18px 0 26px;text-align:center}
.corner{position:absolute;z-index:0;width:34%;height:46px}
.corner.l{inset-inline-start:0;top:40%}
.corner.r{inset-inline-end:0;bottom:2px}
.tagw{display:inline-flex;align-items:center;gap:4px}
.tagw .dc{position:static;width:30px}
.tagw .dc:last-child{transform:scaleX(-1)}
.h1w{margin-top:6px}
.h1w .paper{padding:12px 20px 14px}
.subw{margin-top:-4px}
.subw .paper{font-size:18px;font-style:italic}
.subw .dc{width:30px;top:4px;inset-inline-start:-28px;transform:rotate(70deg)}
.band .d1{width:46px;top:8px;inset-inline-start:10px;transform:rotate(-12deg)}
.band .d2{width:52px;top:4px;inset-inline-end:8px;transform:rotate(14deg)}
/* progression */
.prog{margin:18px 0 0}
.prog .paper{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px 16px}
.dots{display:flex;align-items:center;justify-content:center}
.dot{flex:0 0 auto;width:var(--d);height:var(--d);border-radius:50%;border:3px solid var(--navy);background:#FFFBEA;display:grid;place-items:center;position:relative;padding:0}
.dot img{width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff}
.dot.on::after{content:"×";position:absolute;inset-inline-end:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--plum);color:#fff;font-size:13px;line-height:18px;text-align:center}
.dot.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.18)}}
.link{width:var(--l);height:3px;background:var(--navy);flex:0 0 auto}
.ptxt{text-align:center;font-size:19px;font-weight:800;line-height:1.25;color:var(--navy)}
.ptxt span{font-weight:600;font-size:16px;opacity:.9}
/* produits */
.grid{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}}
.item .sh{height:100%;transition:filter .2s}
.item.sel .sh{filter:drop-shadow(2.5px 0 0 var(--cob)) drop-shadow(-2.5px 0 0 var(--cob)) drop-shadow(0 2.5px 0 var(--cob)) drop-shadow(0 -2.5px 0 var(--cob)) drop-shadow(0 5px 4px rgba(21,48,200,.2))}
.card{height:100%;display:flex;flex-direction:column;padding:12px 10px 14px}
.ph{display:block;position:relative;aspect-ratio:1/1;background:#fff;border-radius:6px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.qbadge{position:absolute;top:6px;inset-inline-end:6px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--cob);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;direction:ltr}
.item:not(.sel) .qbadge{display:none}
.item .tape{width:64px;top:2px;inset-inline-start:10px;transform:rotate(-14deg)}
.brandp{display:block;margin:8px 2px 0;font-size:13px;font-weight:800;color:var(--lav3);line-height:1.2;text-transform:uppercase;letter-spacing:.3px}
.name{display:block;margin:2px 2px 0;font-size:16px;font-weight:800;line-height:1.2;color:var(--navy);flex:1}
.brandp,.name{unicode-bidi:plaintext;text-align:start}
[dir=rtl] .brandp,[dir=rtl] .name{text-align:right}
.price{margin:6px 2px 0;font-weight:800;font-size:17px;color:var(--navy);white-space:nowrap}
.price.tbd{width:max-content;max-width:100%;font-size:13px;font-weight:700;color:var(--muted);background:var(--lav);border:1.5px dashed var(--lav3);border-radius:6px;padding:1px 6px;white-space:normal;line-height:1.3}
.note{display:flex;justify-content:center;margin:24px 0 0}
.note .paper{font-size:15px;padding:6px 16px 8px;color:var(--muted)}
@media(max-width:370px){.pl,.mi{width:38px;height:38px;font-size:24px}.name{font-size:15px}}
.item .qty{justify-content:space-between;margin-top:10px}
.item .qty output{flex:1}
.open-p{display:block;width:100%;text-align:start;padding:0;cursor:pointer}
.open-p:hover .name,.open-p:focus-visible .name{text-decoration:underline;text-decoration-color:var(--yel2);text-decoration-thickness:3px}
.more{display:inline-flex;align-items:center;gap:4px;margin:4px 2px 0;font-size:13px;font-weight:800;color:var(--cob);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
/* barre de progression + bouton « Modifier le pack » */
.pbar{width:min(260px,80%);height:8px;border-radius:4px;background:rgba(22,35,138,.15);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:4px;background:var(--cob);transition:width .45s cubic-bezier(.3,.8,.3,1)}
.editp{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 14px 5px;margin-top:2px;border-radius:999px;background:#fff;color:var(--cob);font-weight:800;font-size:14px;text-decoration:none;box-shadow:0 2px 0 rgba(22,35,138,.25);transition:transform .15s}
.editp svg{width:16px;height:16px}
.editp:hover{transform:translateY(-1px)}
.cta .ck{display:inline-block;margin-inline-end:6px;animation:tick .35s ease-out}
/* ===== Cartes produit : gabarit identique pour toutes ===== */
.grid{align-items:stretch}
.item,.item .sh{height:100%}
.card{height:100%;display:flex;flex-direction:column;padding:12px 10px 12px}
.open-p{display:flex;flex-direction:column;width:100%;text-align:start;padding:0;cursor:pointer}
.ph{display:block;position:relative;width:100%;aspect-ratio:1/1;background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid var(--lav)}
.ph img{width:100%;height:100%;object-fit:contain;padding:6px}
.brandp{display:block;margin:10px 2px 0;height:16px;font-size:12.5px;line-height:16px;font-weight:800;color:var(--lav3);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{flex:0 0 auto;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;margin:3px 2px 0;font-size:15px;line-height:1.22;height:calc(15px*1.22*4);font-weight:800;color:var(--navy);overflow-wrap:anywhere}
.brandp,.name{unicode-bidi:plaintext;text-align:start}
[dir=rtl] .brandp,[dir=rtl] .name{text-align:right}
.price{display:flex;align-items:center;height:30px;margin:6px 2px 0;font-weight:800;font-size:17px;color:var(--navy);white-space:nowrap}
.price.tbd{display:inline-flex;width:max-content;max-width:100%;height:28px;padding:0 8px;font-size:13px;font-weight:700;color:var(--muted);background:var(--lav);border:1.5px dashed var(--lav3);border-radius:8px;overflow:hidden;text-overflow:ellipsis}
.item .qty{margin-top:8px;height:50px;justify-content:space-between}
.item .qty output{flex:1}
.item .pl,.item .mi{width:44px;height:44px}
.more{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--cob);text-decoration:underline}
/* ===== Bouton « Voir plus » : vrai bouton ===== */
.vplus{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:10px;
  background:var(--grain),#fff;color:var(--cob);border:2.5px solid var(--cob);border-radius:14px;box-shadow:0 3px 0 var(--cob);
  font-weight:800;font-size:16px;line-height:1;cursor:pointer;transition:transform .12s,box-shadow .12s,background-color .12s}
.vplus .varr{font-size:19px;transition:transform .15s}
[dir=rtl] .vplus .varr{transform:scaleX(-1)}
.vplus .vs{width:20px;top:-11px;inset-inline-end:-6px}
.vplus:hover{background:var(--grain),var(--yel)}
.vplus:hover .varr{transform:translateX(3px)}
[dir=rtl] .vplus:hover .varr{transform:scaleX(-1) translateX(3px)}
.vplus:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cob)}
.vplus:focus-visible{outline:3px solid var(--yel2);outline-offset:3px}
@media(max-width:370px){.vplus{font-size:15px;gap:6px}.name{font-size:14px;height:calc(14px*1.22*4)}.item .pl,.item .mi{width:40px;height:40px}}
/* rien sous la barre fixe */
body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
/* ===== Fenêtre « pack complet » ===== */
.swm{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(27,18,64,.55)}
.swm.open{display:flex;animation:fadein .15s ease-out}
.swbox{width:min(460px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--grain),var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(27,18,64,.35);animation:popin .22s cubic-bezier(.2,.9,.3,1.2)}
.swhead{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 22px 18px;z-index:2}
[dir=rtl] .swhead{padding:14px 18px 22px 14px}
.swhead>.bg,.swfoot>.bg{position:absolute;inset:0;z-index:-1}
.swtitle{display:flex;align-items:center;gap:6px;min-width:0}
.swtitle .dc{position:static;width:30px;flex:0 0 auto}
.swtitle h2{margin:0;font-size:22px;line-height:1.15;color:var(--navy)}
.swbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 14px}
.swlab{margin:12px 2px 8px;font-size:15px;font-weight:800;color:var(--navy)}
.swnew,.swlist button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;text-align:start}
.swnew{background:var(--grain),var(--yel);box-shadow:0 3px 0 var(--yel2)}
.swnew img,.swlist img{flex:0 0 auto;width:52px;height:52px;object-fit:contain;background:#fff;border-radius:10px}
.swn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.swn small{font-size:11.5px;font-weight:800;color:var(--lav3);text-transform:uppercase;letter-spacing:.3px;unicode-bidi:plaintext;text-align:start}
.swn b{font-size:15px;line-height:1.22;color:var(--navy);unicode-bidi:plaintext;text-align:start}
[dir=rtl] .swn small,[dir=rtl] .swn b{text-align:right}
.swnew .swn small{color:var(--navy);opacity:.7}
.swplus{flex:0 0 auto;font-weight:800;font-size:15px;color:#fff;background:var(--cob);border-radius:999px;padding:4px 10px;direction:ltr}
.swlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.swlist button{min-height:72px;background:#fff;border:2.5px solid var(--lav2);box-shadow:0 2px 0 var(--lav2);cursor:pointer;transition:border-color .15s,background-color .15s,box-shadow .15s}
.swlist button:hover{border-color:var(--lav3)}
.swlist button:focus-visible{outline:3px solid var(--yel2);outline-offset:2px}
.swlist button[aria-checked=true]{border-color:var(--cob);background:var(--grain),#F1EEFF;box-shadow:0 3px 0 var(--cob)}
.swradio{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--lav3);background:#fff;display:grid;place-items:center}
.swlist button[aria-checked=true] .swradio{border-color:var(--cob);background:var(--cob);box-shadow:inset 0 0 0 4px #fff}
.swq{flex:0 0 auto;font-weight:800;font-size:15px;color:var(--navy);background:var(--lav);border-radius:999px;padding:3px 10px}
.swfoot{position:relative;flex:0 0 auto;display:grid;gap:4px;padding:18px 16px calc(12px + env(safe-area-inset-bottom));z-index:2}
.swhint{margin:0;text-align:center;font-size:14px;font-weight:700;color:var(--navy);opacity:.8}
.swgo{height:52px;border-radius:26px;box-shadow:0 3px 0 var(--navy)}
.swgo:disabled{background:#C9C2DE;box-shadow:none;cursor:not-allowed}
@media(max-width:600px){.swm{align-items:flex-end;padding:0}.swbox{width:100%;max-height:92dvh;border-radius:22px 22px 0 0;animation-name:slideup}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<!-- Mini-barre de suivi : visible quand la grande progression est hors de l'écran -->
<div class="mini" id="mini" aria-hidden="true"><div class="minin"><div class="dots" id="miniDots"></div><b id="miniTxt"></b></div></div>

<section class="band">
  <div class="bg paper lav" data-torn="9" data-sides="tb"></div>
  <div class="corner l paper yel" data-torn="6" data-sides="tbr"></div>
  <div class="corner r paper yel" data-torn="6" data-sides="tbl"></div>
  <span class="dc d1" data-dc="heart"></span><span class="dc d2" data-dc="face"></span>
  <div class="wrap">
    <div class="tagw"><span class="dc" data-dc="rays"></span><div class="sh"><div class="paper yel" data-torn="3"><span class="tag" data-tag></span></div></div><span class="dc" data-dc="rays"></span></div><br>
    <div class="h1w"><div class="sh"><div class="paper" data-torn="6"><h1 data-i18n="title"></h1></div></div></div><br>
    <div class="subw"><div class="sh"><div class="paper" data-torn="4"><span data-i18n="sub"></span></div></div><span class="dc" data-dc="rays"></span></div>
  </div>
</section>

<main class="wrap wide">
  <section class="prog" aria-live="polite">
    <div class="sh"><div class="paper yel" data-torn="6">
      <div class="dots" id="dots"></div>
      <div class="pbar" aria-hidden="true"><i id="pfill"></i></div>
      <div class="ptxt" id="ptxt"></div>
      <a class="editp" id="editp" href="etape-2.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span id="editTxt"></span></a>
    </div></div>
  </section>
  <ul class="grid" id="grid"></ul>
  <div class="note"><div class="sh"><div class="paper" data-torn="4"><span data-i18n="hint"></span></div></div></div>
</main>

<div class="bar">
  <div class="barin">
    <div class="mine"><span class="dc" data-dc="side"></span><span id="mineTxt"></span></div>
    <button class="cta" id="cta" type="button" disabled><span id="ctaTxt"></span></button>
  </div>
</div>

<!-- Remplacement d'un masque (pack complet) -->
<div class="swm" id="swm" role="dialog" aria-modal="true" aria-labelledby="swT" aria-describedby="swDesc">
  <div class="swbox">
    <header class="swhead">
      <div class="bg paper lav" data-torn="7" data-sides="b"></div>
      <span class="swtitle"><span class="dc" data-dc="sparks"></span><h2 id="swT"></h2></span>
      <button class="pclose" type="button" id="swX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="swbody" id="swBody"></div>
    <footer class="swfoot">
      <div class="bg paper lav" data-torn="6" data-sides="t"></div>
      <p class="swhint" id="swHint" aria-live="polite"></p>
      <button class="go swgo" type="button" id="swGo" disabled></button>
      <button class="ghost" type="button" id="swCancel"></button>
    </footer>
  </div>
</div>

<!-- Fiche produit -->
<div class="pmodal" id="pm" role="dialog" aria-modal="true" aria-labelledby="pmName">
  <div class="pbox">
    <div class="phead">
      <div class="bg paper lav" data-torn="7" data-sides="b"></div>
      <span class="ptag"><span class="dc" data-dc="rays"></span><span class="sh"><span class="paper yel" data-torn="3"><span class="tag" id="pmTag"></span></span></span></span>
      <button class="pclose" type="button" id="pmX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="pscroll" id="pmBody"></div>
    <div class="pfoot">
      <div class="bg paper lav" data-torn="6" data-sides="t"></div>
      <div class="qty" id="pmQty"></div>
      <button class="back" type="button" id="pmBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg><span id="pmBackTxt"></span></button>
    </div>
  </div>
</div>

<script src="assets/products.js"></script>
<script src="assets/app.js"></script>
<script>
{
const {CONFIG, esc, iso, chrome, i18n, getLang, getPack, toast, fmt, go, deco, tear, lock, Pack, Cart, onChange, byId, products, T, dialog, anim, RM, url} = MC;
const P = {
  fr:{title_html:'Compose ton <span class="hl">pack</span> !',sub:"Choisis tes masques préférés",hint:"Tu peux choisir plusieurs fois le même masque.",
      add:"Ajouter",remove:"Retirer un",tbd:"Prix à renseigner",details:"Voir la fiche",more:"Voir plus",
      prog:(n,t)=>`${iso(n+"/"+t)} masques choisis`,left:k=>k===0?"Pack complet ✓":`Encore ${k} à choisir`,
      mine:(n,t)=>`Mon pack : ${iso(n+"/"+t)}`,cta:"Ajouter au panier",toastFull:"Ton pack est complet !",
      empty:"Vide",removeOne:"Retirer ce masque",sheetTag:"Fiche produit",photo:n=>`Photo ${n}`,
      packText:"Mentions imprimées sur l'emballage",packNote:"Recopiées telles quelles, dans la langue de l'emballage.",
      info:"Description",usage:"Mode d'emploi",video:"Vidéo",notGiven:"Information non fournie pour l'instant.",
      backTo:"Retour à mon pack",inPack:"Dans mon pack",
      edit:"Modifier le pack",added:"Pack ajouté au panier ✓",addedBtn:"Ajouté",swapT:"Ton pack est complet !",swap:"Tu veux ajouter :",swapWhich:"Choisis le masque à remplacer :",swapCancel:"Annuler",swapGo:"Remplacer ce masque",swapPick:"Touche un masque ci-dessus",swapIn:"Ton pack :",swapped:(a,b)=>`${a} remplacé par ${b}`,swapAria:n=>`Remplacer un masque par ${n}`},
  ar:{title_html:'كوّني <span class="hl">الباك</span> ديالك!',sub:"اختاري الماسكات المفضلة عندك",hint:"تقدري تختاري نفس الماسك أكثر من مرة.",
      add:"إضافة",remove:"نقص واحد",tbd:"الثمن: يُحدَّد",details:"شوفي التفاصيل",more:"شوفي المزيد",
      prog:(n,t)=>`${iso(n+"/"+t)} ماسكات مختارة`,left:k=>k===0?"الباك كامل ✓":`باقي ${k} للاختيار`,
      mine:(n,t)=>`الباك ديالي: ${iso(n+"/"+t)}`,cta:"أضيفي للسلة",toastFull:"الباك ديالك كامل!",
      empty:"فارغ",removeOne:"حيدي هاد الماسك",sheetTag:"بطاقة المنتج",photo:n=>`صورة ${n}`,
      packText:"المكتوب على العلبة",packNote:"منقول كما هو، بلغة العلبة.",
      info:"الوصف",usage:"طريقة الاستعمال",video:"فيديو",notGiven:"المعلومة ما زال ما تعطاتش.",
      backTo:"رجوع للباك ديالي",inPack:"فالباك ديالي",
      edit:"بدّلي الباك",added:"الباك تزاد للسلة ✓",addedBtn:"تزاد",swapT:"الباك ديالك كامل!",swap:"بغيتي تزيدي:",swapWhich:"اختاري الماسك اللي غادي تبدّلي:",swapCancel:"إلغاء",swapGo:"بدّلي هاد الماسك",swapPick:"اختاري ماسك من الفوق",swapIn:"الباك ديالك:",swapped:(a,b)=>`تبدّل ${a} بـ ${b}`,swapAria:n=>`بدّلي ماسك بـ ${n}`},
  en:{title_html:'Build your <span class="hl">pack</span>!',sub:"Pick your favourite masks",hint:"You can pick the same mask more than once.",
      add:"Add",remove:"Remove one",tbd:"Price to be set",details:"View details",more:"See more",
      prog:(n,t)=>`${iso(n+"/"+t)} masks selected`,left:k=>k===0?"Pack complete ✓":`${k} more to pick`,
      mine:(n,t)=>`My pack: ${iso(n+"/"+t)}`,cta:"Add to cart",toastFull:"Your pack is complete!",
      empty:"Empty",removeOne:"Remove this mask",sheetTag:"Product details",photo:n=>`Photo ${n}`,
      packText:"Printed on the packaging",packNote:"Copied as printed, in the packaging's language.",
      info:"Description",usage:"How to use",video:"Video",notGiven:"Not provided yet.",
      backTo:"Back to my pack",inPack:"In my pack",
      edit:"Change pack",added:"Pack added to cart ✓",addedBtn:"Added",swapT:"Your pack is complete!",swap:"You want to add:",swapWhich:"Choose the mask to replace:",swapCancel:"Cancel",swapGo:"Replace this mask",swapPick:"Tap a mask above",swapIn:"Your pack:",swapped:(a,b)=>`${a} replaced with ${b}`,swapAria:n=>`Replace a mask with ${n}`}
};

let lang = getLang() || "fr";
const N = getPack();
if (!N) go(2);                                   // pas de pack choisi → retour à l'étape 2
const $ = id => document.getElementById(id);
let pmId = null, opener = null, wasFull = null;

function qtyCtl(x, p){
  const q = Pack.qty(x.id), full = Pack.count() >= (N||0);
  return `<button class="mi" type="button" data-act="minus" aria-label="${esc(p.remove+' – '+x.name)}" ${q?'':'disabled'}>−</button>
    <output aria-live="polite">${q}</output>
    <button class="pl" type="button" data-act="plus" aria-label="${esc(full ? p.swapAria(x.name) : p.add+' – '+x.name)}">+</button>`;
}

function renderAll(){
  const p = P[lang];
  chrome(3, lang, {onLang:l => { lang = l; renderAll(); if (pmId) openP(pmId, true); }});
  i18n(p);
  $("ctaTxt").textContent = p.cta;
  $("grid").innerHTML = products().map(x => `
    <li class="item" data-id="${esc(x.id)}"><div class="sh">
      <div class="paper card" data-torn="5">
        <button class="open-p" type="button" data-open aria-label="${esc(p.details+' – '+x.name)}">
          <span class="ph"><img src="${esc(x.images[0])}" alt="" loading="lazy" width="600" height="600"><span class="qbadge"></span></span>
          <span class="brandp">${esc(x.brand)}</span>
          <span class="name" title="${esc(x.name)}">${esc(x.name)}</span>
        </button>

        <div class="price ${x.price==null?'tbd':''}">${x.price==null?esc(p.tbd):esc(fmt(x.price))}</div>
        <button class="vplus" type="button" data-open aria-label="${esc(p.more+' – '+x.brand+' '+x.name)}" aria-haspopup="dialog">
          <span class="vtxt">${esc(p.more)}</span><span class="varr" aria-hidden="true">→</span><span class="dc vs" data-dc="sparks"></span>
        </button>
        <div class="qty"></div>
      </div>
      <span class="tape ${esc(x.tape||'ging')}"></span>
    </div></li>`).join("");
  deco(); tear();
  renderState();
}

/* Met à jour les boutons − / + sans les recréer (l'effet au toucher reste visible) */
function syncQty(box, x, p){
  if (!box.firstElementChild) box.innerHTML = qtyCtl(x, p);
  const q = Pack.qty(x.id), full = Pack.count() >= N;
  box.querySelector(".mi").disabled = !q;
  box.querySelector("output").textContent = q;
  box.querySelector(".pl").setAttribute("aria-label", full ? p.swapAria(x.name) : p.add + " – " + x.name);
}

let lastN = null;
function renderState(pulse){
  const p = P[lang], n = Pack.count(), full = n >= N;
  document.querySelectorAll(".item").forEach(c => {
    const x = byId(c.dataset.id), q = Pack.qty(x.id);
    c.classList.toggle("sel", q > 0);
    c.querySelector(".qbadge").textContent = "×" + q;
    syncQty(c.querySelector(".qty"), x, p);
  });
  const d = N <= 3 ? 44 : N <= 4 ? 42 : 36, l = N <= 3 ? 26 : N <= 4 ? 16 : 10;
  let h = "";
  for (let i = 0; i < N; i++){
    if (i) h += `<span class="link${i < n ? ' on' : ''}" aria-hidden="true"></span>`;
    const x = byId(Pack.order[i]);
    h += x ? `<button type="button" class="dot on${pulse===i?' pop':''}" data-rm="${esc(x.id)}" aria-label="${esc(p.removeOne+' : '+x.name)}"><img src="${esc(x.images[0])}" alt=""></button>`
           : `<span class="dot" aria-label="${esc(p.empty)}"></span>`;
  }
  $("dots").innerHTML = h;
  $("dots").style.cssText = `--d:${d}px;--l:${l}px`;
  $("miniDots").innerHTML = h.replace(/ pop/g, "");        // mêmes cercles, une photo par unité
  $("miniDots").style.cssText = `--d:${N <= 4 ? 30 : 26}px;--l:${N <= 4 ? 10 : 6}px`;
  $("miniTxt").textContent = iso(n + "/" + N);
  updMini();
  $("ptxt").innerHTML = `${esc(p.prog(n, N))}<br><span>${esc(p.left(N - n))}</span>`;
  $("mineTxt").textContent = p.mine(n, N);
  $("pfill").style.width = (n / N * 100) + "%";
  $("editTxt").textContent = p.edit; $("editp").href = url(2);
  if (lastN !== null && n !== lastN){ anim($("ptxt"), "tickn"); anim($("mineTxt"), "tickn"); }
  // pack qui devient complet : petite célébration, puis le bouton s'active
  if (full && wasFull === false && !RM()){
    $("cta").disabled = true; celebrate(); pendingReady = true;
    clearTimeout(readyT);
    readyT = setTimeout(() => { pendingReady = false; if (Pack.count() >= N){ $("cta").disabled = false; anim($("cta"), "ready"); } }, 420);
  } else if (!pendingReady || !full){
    if (!full){ clearTimeout(readyT); pendingReady = false; }
    $("cta").disabled = !full;
  }
  wasFull = full; lastN = n;
  if (pmId) syncQty($("pmQty"), byId(pmId), p);
}
let readyT = 0, pendingReady = false;

function cardOf(id){ return document.querySelector(`.item[data-id="${CSS.escape(id)}"]`); }
const onScreen = r => r.bottom > 0 && r.top < innerHeight && r.width > 0;

/* Photo qui glisse de la carte vers le cercle (ajout) ou du cercle vers la carte (retrait) */
function glide(src, from, to, {size, toSize, fadeIn = false, done} = {}){
  const f = document.createElement("img"); f.src = src; f.className = "fly"; f.alt = "";
  Object.assign(f.style, {left:(from.left + from.width/2 - size/2)+"px", top:(from.top + from.height/2 - size/2)+"px", width:size+"px", height:size+"px"});
  document.body.appendChild(f);
  const dx = to.left + to.width/2 - (from.left + from.width/2), dy = to.top + to.height/2 - (from.top + from.height/2);
  const lift = Math.min(60, Math.abs(dy) * .25);           // petite courbe, comme une feuille qu'on pose
  f.animate([
    {transform:"translate(0,0) scale(1) rotate(0deg)", opacity: fadeIn ? .7 : 1},
    {transform:`translate(${dx*.5}px,${dy*.5 - lift}px) scale(${(1 + toSize/size)/2}) rotate(-6deg)`, opacity:1, offset:.55},
    {transform:`translate(${dx}px,${dy}px) scale(${toSize/size}) rotate(0deg)`, opacity: fadeIn ? 0 : .9}
  ], {duration:460, easing:"cubic-bezier(.35,.1,.25,1)"}).onfinish = () => { f.remove(); done && done(); };
}
/* Zone réellement visible : sous l'en-tête / la mini-barre, au-dessus de la barre fixe du bas */
function viewBox(){
  const bar = document.querySelector(".bar").getBoundingClientRect().top;
  const mini = miniOn ? $("mini").getBoundingClientRect().bottom : 0;
  return {top: mini, bottom: bar};
}
const fullyIn = r => { const v = viewBox(); return r.width > 0 && r.top >= v.top - 1 && r.bottom <= v.bottom + 1; };
/* Le cercle n°i qu'on voit : celui de la grande barre s'il est à l'écran, sinon celui de la mini-barre */
function dotAt(i){
  updMini();                                       // décision à jour, même sans défilement récent
  const main = $("dots").querySelectorAll(".dot")[i];
  return miniOn ? ($("miniDots").querySelectorAll(".dot")[i] || main) : main;
}
/* Si la carte est hors écran, on vise le bord de l'écran dans sa direction */
function clampToView(r){
  const v = viewBox(), h = Math.max(40, r.height * .3);
  if (r.bottom < v.top + 10) return {left:r.left, width:r.width, height:h, top:v.top - h * .5};
  if (r.top > v.bottom - 10) return {left:r.left, width:r.width, height:h, top:v.bottom - h * .5};
  return r;
}
function flyIn(id){
  const dot = dotAt(Pack.count() - 1);
  if (RM() || !dot) return;
  // départ : la photo de la fiche produit si elle est ouverte, sinon la photo de la carte
  const srcImg = (pmId === id && $("pm").classList.contains("open") && document.querySelector("#gal img")) || cardOf(id)?.querySelector(".ph img");
  if (!srcImg) return;
  const a = clampToView(srcImg.getBoundingClientRect()), b = dot.getBoundingClientRect();
  dot.classList.add("pending");
  const twin = twinDot(dot); twin && twin.classList.add("pending");
  glide(srcImg.src, a, b, {size:Math.min(a.width, 72), toSize:b.width, done:() => {
    dot.classList.remove("pending"); twin && twin.classList.remove("pending"); anim(dot, "fillin");
  }});
}
function twinDot(dot){                                     // le cercle correspondant dans l'autre barre
  const mainList = [...$("dots").querySelectorAll(".dot")], miniList = [...$("miniDots").querySelectorAll(".dot")];
  let i = mainList.indexOf(dot); if (i >= 0) return miniList[i];
  i = miniList.indexOf(dot); return i >= 0 ? mainList[i] : null;
}
function flyOut(id, from){
  if (RM() || !from) return;
  const img = cardOf(id)?.querySelector(".ph img"); if (!img) return;
  const to = clampToView(img.getBoundingClientRect());
  glide(from.src, from.rect, to, {size:from.rect.width, toSize:Math.min(to.width, 72), fadeIn:true});
}

/* Mini-barre : visible si et seulement si les grands cercles ne sont pas entièrement à l'écran */
let miniOn = false, miniRaf = 0;
function showMini(v){ if (v === miniOn) return; miniOn = v; $("mini").classList.toggle("on", v); }
function updMini(){
  miniRaf = 0;
  const r = $("dots").getBoundingClientRect(), bar = document.querySelector(".bar").getBoundingClientRect().top;
  showMini(!(r.top >= 0 && r.bottom <= bar));
}
addEventListener("scroll", () => { if (!miniRaf) miniRaf = requestAnimationFrame(updMini); }, {passive:true});
addEventListener("resize", () => { if (!miniRaf) miniRaf = requestAnimationFrame(updMini); });

/* Célébration : quelques étoiles et bouts de papier, depuis le bouton du bas (toujours visible)
   et depuis la progression si elle est à l'écran */
function burst(r, count, up){
  const layer = document.createElement("div"); layer.className = "confetti"; layer.setAttribute("aria-hidden","true");
  Object.assign(layer.style, {left:r.left + r.width/2 + "px", top:r.top + r.height*0.4 + "px"});
  const kinds = ["star:#F7D33A","star:#1530C8","paper:#CDBBF3","paper:#FBE38A","paper:#1530C8","star:#fff"];
  for (let i = 0; i < count; i++){
    const k = kinds[i % kinds.length].split(":"), el = document.createElement("span");
    el.className = "cf " + k[0];
    el.innerHTML = k[0] === "star" ? `<svg viewBox="0 0 20 20"><path d="M10 1l2.6 5.6 6 .7-4.5 4.1 1.2 6L10 14.4 4.7 17.4l1.2-6L1.4 7.3l6-.7z" fill="${k[1]}" stroke="#1530C8" stroke-width="1.2" stroke-linejoin="round"/></svg>` : "";
    if (k[0] === "paper") el.style.background = k[1];
    layer.appendChild(el);
    // vers le haut quand ça part de la barre du bas, en éventail sinon
    const ang = up ? (-Math.PI * (0.12 + 0.76 * (i / (count - 1)))) + (Math.random() - .5) * .25 : (i / count) * Math.PI * 2 + Math.random() * .4;
    const dist = (up ? 70 : 55) + Math.random() * 60;
    const x = Math.cos(ang) * dist * (up ? 1.5 : 1.4), y = Math.sin(ang) * dist * (up ? 1 : .8) - (up ? 0 : 20);
    el.animate([
      {transform:"translate(-50%,-50%) scale(.3) rotate(0deg)", opacity:0},
      {transform:`translate(calc(-50% + ${x*.7}px),calc(-50% + ${y*.7}px)) scale(1) rotate(${ang*60}deg)`, opacity:1, offset:.45},
      {transform:`translate(calc(-50% + ${x}px),calc(-50% + ${y + 26}px)) scale(.8) rotate(${ang*90}deg)`, opacity:0}
    ], {duration:780 + Math.random()*180, easing:"cubic-bezier(.2,.7,.3,1)"});
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 1100);
}
function celebrate(){
  if (RM()) return;
  burst($("cta").getBoundingClientRect(), 14, true);
  const strip = document.querySelector(".prog .paper")?.getBoundingClientRect();
  if (strip && strip.top > 60 && strip.bottom < innerHeight - 100) burst(strip, 10, false);
}

/* Retour visuel sur LA carte touchée (trouvée par son identifiant), à chaque changement de quantité */
function cardFeedback(id, delta){
  const c = cardOf(id); if (!c) return;
  const up = delta > 0;
  anim(c.querySelector(".sh"), up ? "bump" : "dip");               // la carte réagit
  anim(c.querySelector(".ph"), up ? "flashup" : "flashdown");       // anneau jaune (ajout) / lavande (retrait) sur la photo
  anim(c.querySelector(".qbadge"), "popn");                         // pastille ×n
  anim(c.querySelector(".qty output"), up ? "rollup" : "rolldown"); // le chiffre défile vers le haut / le bas
  anim(c.querySelector(up ? ".pl" : ".mi"), "press");              // le bouton utilisé
  if (pmId === id){ anim($("pmQty").querySelector("output"), up ? "rollup" : "rolldown"); }
}
async function change(id, delta){
  const p = P[lang], before = Pack.count();
  if (delta > 0 && before >= N) return swap(id);  // pack complet → proposer un remplacement
  let fromRect = null;
  if (delta < 0){                                  // retenir le cercle VISIBLE qui va se vider, pour l'animation inverse
    const i = Pack.order.lastIndexOf(id), dot = i >= 0 ? dotAt(i) : null, img = dot && dot.querySelector("img");
    if (dot && img) fromRect = {rect: dot.getBoundingClientRect(), src: img.src};
  }
  if (Pack.setQty(id, Pack.qty(id) + delta)){
    renderState(delta > 0 ? Pack.count() - 1 : undefined);
    const c = cardOf(id);
    cardFeedback(id, delta);
    if (delta > 0) flyIn(id); else flyOut(id, fromRect);
    if (Pack.count() === N && before < N) toast(p.toastFull);
  }
}
const ISO = v => "⁨" + v + "⁩";               // isole un nom latin dans une phrase arabe
/* Fenêtre de remplacement : choisir un masque, puis confirmer */
let swNew = null, swPick = null, swOpener = null;
function swap(newId){
  const p = P[lang], nx = byId(newId);
  const inPack = [...new Set(Pack.order)].map(byId).filter(x => x.id !== newId);
  if (!inPack.length) return toast(T[lang].full(N));
  swNew = newId; swPick = null; swOpener = document.activeElement;
  $("swT").textContent = p.swapT;
  $("swX").setAttribute("aria-label", T[lang].close);
  const row = (x, extra = "") => `<img src="${esc(x.images[0])}" alt=""><span class="swn"><small>${esc(x.brand)}</small><b>${esc(x.name)}</b></span>${extra}`;
  $("swBody").innerHTML = `
    <p class="swlab" id="swDesc">${esc(p.swap)}</p>
    <div class="swnew">${row(nx, '<span class="swplus" aria-hidden="true">+1</span>')}</div>
    <p class="swlab">${esc(p.swapWhich)}</p>
    <ul class="swlist" role="radiogroup" aria-label="${esc(p.swapWhich)}">${inPack.map(x => `
      <li><button type="button" role="radio" aria-checked="false" data-id="${esc(x.id)}">
        <span class="swradio" aria-hidden="true"></span>${row(x, `<span class="swq" dir="ltr">×${Pack.qty(x.id)}</span>`)}
      </button></li>`).join("")}</ul>`;
  $("swGo").textContent = p.swapGo; $("swCancel").textContent = p.swapCancel;
  swUpdate();
  $("swm").classList.add("open"); lock(true); $("swBody").scrollTop = 0;
  tear($("swm")); deco($("swm"));
  $("swBody").querySelector("[role=radio]").focus();
}
function swUpdate(){
  const p = P[lang];
  $("swBody").querySelectorAll("[role=radio]").forEach(b => b.setAttribute("aria-checked", b.dataset.id === swPick));
  $("swGo").disabled = !swPick;
  $("swHint").textContent = swPick ? "" : p.swapPick;
  $("swHint").hidden = !!swPick;
}
function swClose(){
  if (!swNew) return;
  swNew = swPick = null; $("swm").classList.remove("open"); lock(false);
  swOpener && document.contains(swOpener) && swOpener.focus();
}
$("swBody").addEventListener("click", e => { const b = e.target.closest("[role=radio]"); if (b){ swPick = b.dataset.id; swUpdate(); anim(b, "press"); } });
$("swBody").addEventListener("keydown", e => {                       // flèches haut/bas entre les choix
  if (!["ArrowDown","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key)) return;
  const list = [...$("swBody").querySelectorAll("[role=radio]")], i = list.indexOf(document.activeElement); if (i < 0) return;
  e.preventDefault(); const n = list[(i + (e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : list.length - 1)) % list.length];
  n.focus(); swPick = n.dataset.id; swUpdate();
});
$("swX").addEventListener("click", swClose);
$("swCancel").addEventListener("click", swClose);
// le fond assombri ne ferme PAS la fenêtre : la cliente choisit, annule ou ferme avec ×
document.addEventListener("keydown", e => { if (e.key === "Escape" && swNew) swClose(); });
$("swGo").addEventListener("click", () => {
  if (!swNew || !swPick) return;
  const p = P[lang], oldId = swPick, newId = swNew, before = Pack.count();
  swClose();
  Pack.replace(oldId, newId);                        // même nombre total : une unité de l'ancien devient le nouveau
  renderState(Pack.order.lastIndexOf(newId));
  cardFeedback(newId, 1); cardFeedback(oldId, -1);
  if (Pack.count() !== before) console.warn("swap changed total");
  toast(p.swapped(ISO(byId(oldId).name), ISO(byId(newId).name)));
});
onChange(() => renderState());

$("grid").addEventListener("click", e => {
  const item = e.target.closest(".item"); if (!item) return;
  if (e.target.closest("[data-open]")) return openP(item.dataset.id);
  const b = e.target.closest("button[data-act]"); if (b) change(item.dataset.id, b.dataset.act === "plus" ? 1 : -1);
});
["dots","miniDots"].forEach(k => $(k).addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) change(b.dataset.rm, -1); }));

/* Effet au toucher : petit anneau jaune sur +, −, Voir plus, Modifier le pack */
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".pl:not(:disabled), .mi:not(:disabled), .vplus, .editp, .cta:not(:disabled)");
  if (b) anim(b, "tap");
}, {passive:true});

$("cta").addEventListener("click", () => {
  const p = P[lang], b = $("cta");
  if (Pack.count() !== N) return;
  b.innerHTML = `<span class="ck" aria-hidden="true">✓</span>${esc(p.addedBtn)}`;
  toast(p.added);
  anim($("cartBtn"), "cartwig"); anim($("cartCount"), "popn");   // l'icône du panier réagit
  setTimeout(() => { $("ctaTxt") || (b.innerHTML = `<span id="ctaTxt">${esc(p.cta)}</span>`); Cart.open(); }, RM() ? 0 : 750);
});

/* ---------- Fiche produit ---------- */
function section(title, body){ return `<div class="psec"><h3>${esc(title)}</h3>${body}</div>`; }
function openP(id, keep){
  const x = byId(id), p = P[lang]; if (!x) return;
  pmId = id;
  $("pmTag").textContent = p.sheetTag;
  $("pmX").setAttribute("aria-label", T[lang].close);
  const imgs = x.images.map((src,i) => `<figure id="g${i}"><img src="${esc(src)}" alt="${esc(x.brand+' – '+x.name+' · '+p.photo(i+1))}"></figure>`).join("");
  const thumbs = x.images.length > 1 ? `<div class="thumbs">${x.images.map((src,i) => `<button type="button" data-g="${i}" aria-label="${esc(p.photo(i+1))}" aria-current="${i===0}"><img src="${esc(src)}" alt=""></button>`).join("")}</div>` : "";
  const txt = v => v && (v[lang] || null);
  const IC = {
    pack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>',
    use:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    video:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'};
  const card = (cls, ico, title, body) => `<section class="pcard ${cls}"><h3><span class="ico">${IC[ico]}</span>${esc(title)}</h3>${body}</section>`;
  const vidBlock = !x.video ? "" : /\.(mp4|webm|mov)(\?|$)/i.test(x.video)
      ? card("pv", "video", p.video, `<video class="pvideo" src="${esc(x.video)}" controls playsinline preload="metadata"></video>`)
      : card("pv", "video", p.video, `<a class="more" href="${esc(x.video)}" target="_blank" rel="noopener">${esc(p.video)} ↗</a>`);
  $("pmBody").innerHTML = `
    <div class="gwrap">
      <span class="tape ${esc(x.tape||'ging')}"></span><span class="dc gs1" data-dc="sparks"></span><span class="dc gs2" data-dc="rays"></span>
      <div class="sh frame-sh"><div class="paper frame" data-torn="5"><div class="gal" id="gal">${imgs}</div></div></div>
    </div>${thumbs}
    <section class="pid">
      <span class="pbrand">${esc(x.brand)}</span>
      <h2 class="pname" id="pmName">${esc(x.name)}</h2>
      <div class="pprice ${x.price==null?'tbd':''}">${x.price==null?esc(p.tbd):esc(fmt(x.price))}</div>
    </section>
    ${txt(x.info) ? card("pi", "info", p.info, `<p>${esc(txt(x.info))}</p>`) : ""}
    ${x.pack && x.pack.length ? card("pk", "pack", p.packText, `<ul class="checks">${x.pack.map(l => `<li>${esc(l)}</li>`).join("")}</ul><p class="orig">${esc(p.packNote)}</p>`) : ""}
    ${card("pu", "use", p.usage, txt(x.usage) ? `<p>${esc(txt(x.usage))}</p>` : `<p class="missingf">${esc(p.notGiven)}</p>`)}
    ${vidBlock}`;
  tear($("pmBody")); deco($("pmBody"));
  $("pmQty").innerHTML = qtyCtl(x, p);
  $("pmBackTxt").textContent = p.backTo;
  if (!keep){ opener = document.activeElement; $("pm").classList.add("open"); lock(true); $("pmBody").scrollTop = 0; $("pmX").focus(); }
}
function closeP(){ if (!pmId) return; const id = pmId; pmId = null; $("pm").classList.remove("open"); lock(false);
  (opener && document.contains(opener) ? opener : document.querySelector(`.item[data-id="${CSS.escape(id)}"] .vplus`))?.focus(); }
$("pmX").addEventListener("click", closeP);
$("pmBack").addEventListener("click", closeP);
$("pm").addEventListener("click", e => { if (e.target.id === "pm") closeP(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && pmId) closeP(); });
$("pmQty").addEventListener("click", e => { const b = e.target.closest("button[data-act]"); if (b && pmId) change(pmId, b.dataset.act === "plus" ? 1 : -1); });
$("pmBody").addEventListener("click", e => {
  const b = e.target.closest("[data-g]"); if (!b) return;
  $("g"+b.dataset.g).scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
  document.querySelectorAll(".thumbs button").forEach(t => t.setAttribute("aria-current", t === b));
});

renderAll();
}
</script>
